<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Begoosib showcase cover</title>
  <desc id="desc">A vibrant modern pharmacy storefront cover for Begoosib by MAURON.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a16"/><stop offset=".5" stop-color="#0c2920"/><stop offset="1" stop-color="#11172a"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48e597"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c3ffe0" opacity=".08"/></pattern>
  </defs>
  <style>.float{animation:float 4s ease-in-out infinite}.float2{animation:float 5s ease-in-out infinite reverse}@keyframes float{50%{transform:translateY(-8px)}}.scan{stroke-dasharray:8 10;animation:scan 4s linear infinite}@keyframes scan{to{stroke-dashoffset:-72}}</style>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="1098" cy="42" r="176" fill="#8b5cf6" opacity=".09"/><circle cx="40" cy="350" r="170" fill="#48e597" opacity=".08"/>
  <g transform="translate(70 68)">
    <text x="0" y="42" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#48e597" letter-spacing="5">MAURON COMMERCE</text>
    <text x="0" y="118" font-family="Inter,Segoe UI,sans-serif" font-size="68" font-weight="800" fill="#f7fff9">Begoosib</text>
    <text x="2" y="162" font-family="Inter,Segoe UI,sans-serif" font-size="24" fill="#b8d3c4">A modern online pharmacy experience</text>
    <g transform="translate(0 198)"><rect width="130" height="38" rx="19" fill="#48e597" fill-opacity=".12" stroke="#48e597" stroke-opacity=".7"/><circle cx="22" cy="19" r="6" fill="#48e597" filter="url(#glow)"/><text x="40" y="25" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#e7fff1">LIVE STORE</text></g>
  </g>
  <g transform="translate(724 48)">
    <rect x="0" y="26" width="406" height="238" rx="22" fill="#f8fffb"/>
    <rect x="0" y="26" width="406" height="54" rx="22" fill="#ffffff"/><rect x="0" y="62" width="406" height="18" fill="#ffffff"/>
    <circle cx="28" cy="53" r="12" fill="#48e597"/><path d="M22 53h12M28 47v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <rect x="58" y="42" width="184" height="24" rx="12" fill="#eaf5ee"/><circle cx="225" cy="54" r="6" fill="none" stroke="#7b9284" stroke-width="2"/><path d="m229 59 6 6" stroke="#7b9284" stroke-width="2"/>
    <rect x="260" y="42" width="52" height="24" rx="12" fill="#f2edff"/><rect x="324" y="42" width="58" height="24" rx="12" fill="#e7fff1"/>
    <rect x="18" y="96" width="370" height="56" rx="14" fill="url(#brand)" opacity=".95"/>
    <text x="38" y="120" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#082019">HEALTH, BEAUTY &amp; WELLNESS</text><text x="38" y="140" font-family="Inter,sans-serif" font-size="17" font-weight="800" fill="#fff">Everything you need, in one place.</text>
    <g transform="translate(18 170)">
      <g class="float"><rect width="104" height="78" rx="13" fill="#fff" stroke="#d8e8de"/><rect x="14" y="12" width="76" height="38" rx="10" fill="#e8fff2"/><circle cx="52" cy="31" r="13" fill="#48e597" opacity=".55"/><rect x="20" y="60" width="64" height="7" rx="3.5" fill="#b8cec0"/></g>
      <g transform="translate(124)" class="float2"><rect width="104" height="78" rx="13" fill="#fff" stroke="#d8e8de"/><rect x="14" y="12" width="76" height="38" rx="10" fill="#f2edff"/><rect x="42" y="18" width="20" height="28" rx="5" fill="#8b5cf6" opacity=".62"/><rect x="20" y="60" width="64" height="7" rx="3.5" fill="#b8cec0"/></g>
      <g transform="translate(248)" class="float"><rect width="104" height="78" rx="13" fill="#fff" stroke="#d8e8de"/><rect x="14" y="12" width="76" height="38" rx="10" fill="#fff2ef"/><path d="M52 18c12 9 15 20 0 29-15-9-12-20 0-29Z" fill="#ff7b73" opacity=".7"/><rect x="20" y="60" width="64" height="7" rx="3.5" fill="#b8cec0"/></g>
    </g>
    <path d="M20 281H386" stroke="#48e597" stroke-width="2" class="scan"/>
  </g>
</svg>
